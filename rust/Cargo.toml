[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

# Внешние зависимости — только здесь; крейты подключают их `x.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4.3"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
regex = "1.13.1"
fancy-regex = "0.19.2"
unicode-normalization = "0.1.25"
icu_collator = "2.3.1"

sk-dice = { path = "crates/sk-dice" }
sk-core = { path = "crates/sk-core" }
sk-rules = { path = "crates/sk-rules" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[package]
name = "sk-themes"
description = "Темы сцены «Сказания»: каталог тем, опознание по названию и признакам места, сборка тематической сцены поверх генераторов зданий, графа зон, пещеры, открытой местности и поселения"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sk-core.workspace = true
sk-tactical = { path = "../sk-tactical" }
sk-map-core = { path = "../sk-map-core" }
sk-buildings = { path = "../sk-buildings" }
sk-settlements = { path = "../sk-settlements" }
sk-geometry = { path = "../sk-geometry" }
sk-scene-base = { path = "../sk-scene-base" }
sk-props = { path = "../sk-props" }

[dev-dependencies]
# Эталоны сборки сцены хранятся в gzip; версия и возможности — как у sk-props,
# нового в Cargo.lock нет.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

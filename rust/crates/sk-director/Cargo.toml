[package]
name = "sk-director"
description = "Слой локаций сцены «Сказания»: память карт мест, генерация геометрии сцены, выбор готовой постройки и переход между сценами"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sk-core.workspace = true
sk-tactical = { path = "../sk-tactical" }
sk-map-core = { path = "../sk-map-core" }
sk-geometry = { path = "../sk-geometry" }
sk-story = { path = "../sk-story" }
sk-buildings = { path = "../sk-buildings" }
sk-world-time = { path = "../sk-world-time" }
sk-scene-base = { path = "../sk-scene-base" }
sk-settlements = { path = "../sk-settlements" }
sk-themes = { path = "../sk-themes" }
sk-memory = { path = "../sk-memory" }
sk-scenario = { path = "../sk-scenario" }
sk-society = { path = "../sk-society" }

[dev-dependencies]
# Эталоны (состояния корпуса, карты) хранятся в gzip; версия и возможности —
# как у sk-props и sk-themes, нового в Cargo.lock нет.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[package]
name = "sk-world-time"
description = "Время мира «Сказания»: часы и погода кампании, этажи построек и подземелий"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sk-core.workspace = true
sk-themes = { path = "../sk-themes" }
sk-tactical = { path = "../sk-tactical" }
sk-geometry = { path = "../sk-geometry" }
sk-buildings = { path = "../sk-buildings" }
sk-props = { path = "../sk-props" }
sk-map-core = { path = "../sk-map-core" }

[dev-dependencies]
# Эталоны хранятся в gzip; версия и возможности — как у sk-props и sk-themes,
# нового в Cargo.lock нет.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

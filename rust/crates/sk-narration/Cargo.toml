[package]
name = "sk-narration"
description = "Рассказчики «Сказания» без модели: боевая хроника, смена сцены, вступление столкновения и сводка сцены"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sk-core.workspace = true
sk-narration-base = { path = "../sk-narration-base" }
sk-npc-world = { path = "../sk-npc-world" }
sk-combat-content = { path = "../sk-combat-content" }
sk-tactical = { path = "../sk-tactical" }
sk-world-time = { path = "../sk-world-time" }
sk-economy = { path = "../sk-economy" }

[dev-dependencies]
# Эталоны хранятся в gzip; версия и возможности — как у sk-world-time,
# нового в Cargo.lock нет.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

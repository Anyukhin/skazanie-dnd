[package]
name = "sk-props"
description = "Расстановка предметов на тактической карте «Сказания»: мебель по назначению комнаты, ремонт доступа, колоннады, опоры утвари, сюжетные виньетки, трудная местность и развалины"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sk-core.workspace = true
sk-scene-base = { path = "../sk-scene-base" }
sk-tactical = { path = "../sk-tactical" }

[dev-dependencies]
# Эталоны корпуса генераторов хранятся в gzip: карты на входе сжимаются в
# десяток раз. Версия и набор возможностей — как у sk-scene-base, нового в
# Cargo.lock не появляется.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[package]
name = "sk-scene-base"
description = "Основа сцены «Сказания»: словарь объектов сцены, замысел карты, реестр предметов, видимая экипировка и облик, разбор слэбов TaleSpire"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sk-core.workspace = true
# Распаковка слэба TaleSpire (gzip). Только чистый Rust-движок, без zlib на C.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[package]
name = "sk-world-story"
description = "Сюжет мира «Сказания»: проклятый рыцарь сценария в своё окно ночи и канон сцены"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sk-core.workspace = true
sk-scenario = { path = "../sk-scenario" }
sk-world-time = { path = "../sk-world-time" }
sk-geometry = { path = "../sk-geometry" }
sk-npc-world = { path = "../sk-npc-world" }
sk-tactical = { path = "../sk-tactical" }
fancy-regex.workspace = true

[dev-dependencies]
# Эталоны хранятся в gzip; версия и возможности — как у sk-world-time, нового в Cargo.lock нет.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[package]
name = "sk-world-life"
description = "Жизнь мира «Сказания» вне боя: пленные после сдачи и нокаута, почта отряда с курьерами и ответами, должности мира и их преемство"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sk-core.workspace = true
sk-geometry = { path = "../sk-geometry" }
sk-society = { path = "../sk-society" }
sk-social = { path = "../sk-social" }
sk-npc-world = { path = "../sk-npc-world" }
icu_collator.workspace = true
# Локаль `ru` для явного `localeCompare(…, 'ru')`; та же версия, что уже в Cargo.lock.
icu_locale_core = "2.3.0"

[package]
name = "sk-agents-base"
description = "Основа агентов «Сказания»: клиент модели (RouterAI/OhMyLama, каскад запасных моделей, заглушка для тестов) и учёт генераций Архитектора карт"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sk-core.workspace = true
sk-narration-base = { path = "../sk-narration-base" }
tokio = { version = "1.53.2", features = ["rt", "time", "sync", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net", "io-util", "test-util"] }

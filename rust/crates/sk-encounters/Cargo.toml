[package]
name = "sk-encounters"
description = "Встречи «Сказания»: сборка противников по сложности и теме, расстановка на карте по эту сторону дверей и окон от отряда, снаряжение и подрайон боя; общий контекст сцены для агентов-моделей"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sk-core.workspace = true
sk-scene-base = { path = "../sk-scene-base" }
sk-tactical = { path = "../sk-tactical" }
sk-economy = { path = "../sk-economy" }
sk-combat-base = { path = "../sk-combat-base" }
sk-combat-content = { path = "../sk-combat-content" }
sk-geometry = { path = "../sk-geometry" }
# Контекст агентов (`agent_context`): настилы карты, режим кампании и
# замысел без скрытых историй.
sk-map-core = { path = "../sk-map-core" }
sk-society = { path = "../sk-society" }

[package]
name = "sk-narration-base"
description = "Основа рассказчиков «Сказания»: контракт рассказчиков без модели, боевые фразы, профили моделей, контекст кампании, реестр уточнений, голосовой ввод"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
# Точный разбор дробей, как в V8: без `float_roundtrip` serde_json ошибается в
# последнем бите (170.04535323940217 → …215), и хеш проекции расходится с JS.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
sk-core.workspace = true
sk-dice.workspace = true

[package]
name = "sk-rulepack"
description = "Пакеты правил «Сказания»: загрузка и проверка data/rule_packs, локальный поиск по правилам"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sk-core.workspace = true

[dev-dependencies]
# Эталоны JS печатают числа кратчайшей записью; без `float_roundtrip`
# serde_json читает 17-значные дроби с ошибкой в последний бит, и сверка
# векторов «бит в бит» ловила бы ошибку разбора, а не переноса.
serde_json = { workspace = true, features = ["float_roundtrip"] }

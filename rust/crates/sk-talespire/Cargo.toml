[package]
name = "sk-talespire"
description = "Импорт карт TaleSpire: слэб → этажи тактической карты «Сказания», комнаты, переходы, паспорт и ремонт этажа"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sk-core.workspace = true
sk-geometry = { path = "../sk-geometry" }
sk-scene-base = { path = "../sk-scene-base" }
sk-tactical = { path = "../sk-tactical" }
sk-map-core = { path = "../sk-map-core" }
sk-world-time = { path = "../sk-world-time" }
# Тактическая геометрия (`rules/tactical-geometry`): `cellsVisibleFrom` от входа.
sk-rules.workspace = true

[dev-dependencies]
# Эталоны хранятся в gzip; версия и возможности — как у sk-world-time, нового в Cargo.lock нет.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

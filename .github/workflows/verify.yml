name: verify

# Гейт из AGENTS.md §2: `pnpm verify` — это test + typecheck:server + build.
# До появления этого файла проверок не было вовсе, тесты гонялись руками, и
# поэтому красное доезжало до main.
on:
  # Фильтра по базовой ветке здесь быть не должно. Волна из 24 stacked-PR
  # прошла мимо гейта именно из-за него: пятнадцать веток целились в соседние
  # ветки, и на них не запускалась ни одна проверка.
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # На shared runner функциональный корпус занимает около 6 минут, затем
    # `run-test-suite` даёт полному MVP до 20 минут и один повтор при падении.
    # Прежние 25 минут гарантированно обрывали повтор до typecheck и build.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # В package.json нет packageManager, поэтому версия задаётся здесь явно.
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          # Нижняя граница из AGENTS.md §1 — Node >= 20.19.0.
          node-version: 22
          cache: pnpm

      - name: Установить зависимости
        # Без --frozen-lockfile лок молча обновится, и проверка перестанет
        # отвечать на вопрос «работает ли то, что лежит в репозитории».
        run: pnpm install --frozen-lockfile

      - name: Тесты
        run: pnpm test

      - name: Типы сервера
        run: pnpm typecheck:server

      - name: Сборка
        run: pnpm build

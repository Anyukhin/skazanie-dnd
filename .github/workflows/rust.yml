name: rust

# Перенос сервера на Rust (`docs/rust-rewrite-plan.md`): workspace `rust/`
# собирается и проходит свои тесты на Linux — там же, где будет жить
# Docker-образ. Локально на Windows сборка идёт через GNU-toolchain и MinGW
# (`rust/PORTING.md` §6), поэтому без этого гейта разница платформ всплыла бы
# только при переключении.
on:
  pull_request:
    paths: ['rust/**', 'data/**', 'prompts/**', 'Dockerfile.rust', 'deployment/rust/**', '.github/workflows/rust.yml']
  push:
    branches: [main]
    paths: ['rust/**', 'data/**', 'prompts/**', 'Dockerfile.rust', 'deployment/rust/**', '.github/workflows/rust.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Сборка без предупреждений
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --workspace --all-targets --locked

      - name: Тесты
        run: cargo test --workspace --locked

  # Урок 12 плана переноса: один бинарь в образе. Образ собирается тем же
  # Dockerfile.rust, что и у владельца, и должен подняться и ответить на
  # /api/health с пустым хранилищем и без ключа модели.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rust
          load: true
          tags: skazanie-rust:ci
          build-args: |
            CARGO_BUILD_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Запуск и /api/health
        run: |
          docker run -d --name skazanie-rust -p 127.0.0.1:18787:8787 -e ROUTERAI_API_KEY= skazanie-rust:ci
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18787/api/health; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null -w 'health %{http_code}\n' http://127.0.0.1:18787/api/health
          curl -fsS -o /dev/null -w 'index %{http_code}\n' http://127.0.0.1:18787/

      - name: Журнал контейнера
        if: ${{ always() }}
        run: docker logs skazanie-rust || true
